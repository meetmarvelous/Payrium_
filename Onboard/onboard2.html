<!DOCTYPE html>

<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Payrium Splash Screen</title>
  <!-- Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Theme Configuration -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0d59f2",
            "background-light": "#f5f6f8",
            "background-dark": "#101622",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    /* Dynamic viewport height for mobile browsers */
    @supports (height: 100dvh) {
      .h-screen-safe {
        height: 100dvh !important;
      }
    }

    /* Safe area insets for notched devices */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  </style>
</head>

<body
  class="font-display bg-background-light dark:bg-background-dark text-[#111318] dark:text-white overflow-hidden selection:bg-primary/20 h-screen-safe">
  <div class="relative flex h-screen w-full flex-col items-center justify-center group/design-root">
    <!-- Background Decor: Abstract Gradients -->
    <div
      class="absolute top-0 right-0 -mr-20 -mt-20 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] pointer-events-none">
    </div>
    <div
      class="absolute bottom-0 left-0 -ml-20 -mb-20 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px] pointer-events-none">
    </div>
    <!-- Main Content Wrapper -->
    <div class="layout-container z-10 flex flex-col items-center justify-center max-w-[480px] w-full px-6">
      <!-- Logo Component (Standard Payrium) -->
      <div class="flex justify-center mb-10 group cursor-default">
        <div class="relative">
          <div
            class="absolute inset-0 bg-primary/30 blur-2xl rounded-full scale-95 group-hover:scale-110 transition-transform duration-1000">
          </div>
          <div
            class="relative flex h-36 w-36 items-center justify-center rounded-[2rem] bg-gradient-to-br from-primary to-blue-600 text-white shadow-2xl shadow-primary/25 ring-4 ring-white transition-transform duration-500 hover:rotate-3 hover:scale-105">
            <span class="material-symbols-outlined text-[72px]">account_balance_wallet</span>
          </div>
        </div>
      </div>
      <!-- Headline Text -->
      <div class="flex flex-col w-full items-center mb-2">
        <h1 class="text-[#111318] dark:text-white tracking-tight text-[40px] font-bold leading-tight text-center">
          Payrium
        </h1>
      </div>
      <!-- Body Text -->
      <div class="flex flex-col w-full items-center max-w-[320px] mb-12">
        <p class="text-[#637588] dark:text-[#94a3b8] text-lg font-normal leading-relaxed text-center">
          Simple Web3 payments. Multi-chain. Community owned.
        </p>
      </div>
      <!-- Progress Bar -->
      <div class="flex flex-col gap-3 w-full max-w-[240px]">
        <!-- Status Text -->
        <div class="flex justify-center">
          <p class="text-[#637588] dark:text-[#64748b] text-sm font-medium leading-normal tracking-wide uppercase">
            Initializing</p>
        </div>
        <!-- Bar Track -->
        <div class="rounded-full bg-[#dbdfe6] dark:bg-[#2d3748] h-1.5 overflow-hidden w-full">
          <!-- Bar Fill -->
          <div class="h-full rounded-full bg-primary w-[30%]"></div>
        </div>
      </div>
    </div>
    <!-- Footer Version Info -->
    <div class="absolute bottom-8 w-full text-center">
      <p class="text-[#94a3b8] dark:text-[#475569] text-xs font-medium tracking-wider opacity-60">v1.0.2</p>
    </div>
  </div>
  <script>
    // Click anywhere to proceed to next page
    document.body.addEventListener('click', function () {
      window.location.href = 'onboard3.html';
    });
  </script>
</body>

</html>
