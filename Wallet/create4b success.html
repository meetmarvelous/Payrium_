<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Payrium - Wallet Created</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
  <style>
    /* Dynamic viewport height for mobile browsers */
    @supports (height: 100dvh) {
      .h-screen-safe {
        height: 100dvh !important;
      }
    }

    /* Safe area insets for notched devices */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  </style>
</head>

<body
    class="flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark font-display text-[#111318] dark:text-white overflow-x-hidden h-screen-safe">
    <header
        class="flex items-center justify-between whitespace-nowrap border-b border-solid border-[#dbdfe6] dark:border-gray-800 bg-white dark:bg-[#151c2b] px-6 lg:px-40 py-3">
        <div class="flex items-center gap-4">
            <div class="h-8 w-8 rounded-lg bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/20">
                    <span class="material-symbols-outlined text-[20px]">account_balance_wallet</span>
                </div>
            <h2 class="text-lg font-bold leading-tight tracking-[-0.015em] text-[#111318] dark:text-white">Payrium</h2>
        </div>
    </header>
    <main class="flex-1 flex items-center justify-center p-3 sm:p-4">
        <div class="w-full max-w-[480px] flex flex-col items-center">
            <div
                class="w-full bg-white dark:bg-[#151c2b] rounded-2xl shadow-sm border border-[#dbdfe6] dark:border-gray-800 p-4 sm:p-8 flex flex-col items-center text-center">
                <div class="mb-4 sm:mb-6">
                    <span
                        class="inline-block px-2 sm:px-3 py-1 rounded-full bg-background-light dark:bg-gray-800 text-[10px] sm:text-xs font-medium text-[#606e8a] dark:text-gray-400">Step
                        4 of 4</span>
                </div>
                <div class="mb-4 sm:mb-6 relative">
                    <div class="size-20 sm:size-24 bg-primary/10 rounded-full flex items-center justify-center animate-pulse">
                        <div
                            class="size-14 sm:size-16 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/30">
                            <span class="material-symbols-outlined text-white"
                                style="font-size: 32px; font-weight: 700;">check</span>
                        </div>
                    </div>
                </div>
                <div class="mb-4 sm:mb-6">
                    <h1 class="text-[#111318] dark:text-white tracking-tight text-xl sm:text-[28px] font-bold leading-tight mb-2 sm:mb-3">
                        You're all set!</h1>
                    <p class="text-[#606e8a] dark:text-gray-400 text-sm sm:text-base font-normal leading-relaxed">
                        Your Payrium wallet has been successfully created. You can now send, receive, and store assets
                        securely.
                    </p>
                </div>
                <div class="w-full mb-6 sm:mb-8">
                    <div class="flex flex-col text-left">
                        <label
                            class="text-[#111318] dark:text-gray-200 text-xs sm:text-sm font-medium leading-normal pb-1.5 sm:pb-2 ml-1">Your
                            Wallet Address</label>
                        <div
                            class="group flex w-full items-stretch rounded-xl bg-background-light dark:bg-background-dark border border-[#dbdfe6] dark:border-gray-700 transition-colors focus-within:border-primary">
                            <input
                                class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl bg-transparent text-[#111318] dark:text-white focus:outline-0 focus:ring-0 border-none h-10 sm:h-12 px-3 sm:px-4 text-sm sm:text-base font-mono font-medium truncate cursor-text selection:bg-primary/20"
                                readonly="" value="8n2p...k9Yz" />
                            <button
                                class="flex items-center justify-center px-3 sm:px-4 text-[#606e8a] dark:text-gray-400 hover:text-primary transition-colors cursor-pointer"
                                title="Copy Address">
                                <span class="material-symbols-outlined" style="font-size: 18px;">content_copy</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="w-full flex flex-col gap-2 sm:gap-3">
                    <a href="../Dashboard/Dashboard MO.html"
                        class="w-full h-10 sm:h-12 bg-primary hover:bg-blue-700 text-white font-medium rounded-xl transition-colors shadow-lg shadow-primary/20 flex items-center justify-center gap-2 text-sm sm:text-base">
                        <span>Enter Dashboard</span>
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
                    </a>
                    <a href="create2_backup.html"
                        class="w-full h-10 sm:h-12 bg-transparent hover:bg-background-light dark:hover:bg-gray-800 text-[#606e8a] dark:text-gray-400 font-medium rounded-xl transition-colors flex items-center justify-center gap-2 text-sm">
                        <span class="material-symbols-outlined" style="font-size: 18px;">shield</span>
                        <span>Back up Recovery Phrase</span>
                    </a>
                </div>
            </div>
            <p class="mt-4 sm:mt-6 text-xs sm:text-sm text-[#9aa2b1] dark:text-gray-500 text-center flex items-center gap-1.5">
                <span class="material-symbols-outlined" style="font-size: 14px;">lock</span>
                Never share your secret recovery phrase.
            </p>
        </div>
    </main>

</body>

</html>
